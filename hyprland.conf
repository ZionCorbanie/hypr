################
### MONITORS ###
################

monitor=eDP-1,1920x1080@60,0x0,1
monitor=HDMI-A-1,preferred,1920x0,1

$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,rose-pine-hyprcursor
env = WLR_DRM_DEVICES,/dev/dri/card1:/dev/dri/card2
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card2
env = WLR_DRM_NO_ATOMIC,1
env = WLR_NO_HARDWARE_CURSORS,1


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 4
    gaps_out = 12
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(cc33ffff) rgba(884dffff) 45deg
    col.inactive_border = rgba(59595900)
    resize_on_border = false

    allow_tearing = false
    layout = master
}

decoration {
    rounding = 12
    rounding = 8
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

master {
    #new_status = master
    new_on_top = false
    orientation = left
    mfact = 0.5
}

misc {
    force_default_wallpaper = 0 
    disable_hyprland_logo = true
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant = altgr-intl
    kb_options = caps:swapescape
    kb_model =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

gestures {
    workspace_swipe = false
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

$mainMod = ALT

bind = $mainMod, T, exec, $terminal
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod SHIFT, space, togglefloating,
bind = $mainMod, F3, exec, $menu

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod SHIFT, S, movecurrentworkspacetomonitor, l
bind = $mainMod SHIFT, D, movecurrentworkspacetomonitor, r

bind = $mainMod SHIFT, M, layoutmsg, swapwithmaster #swap slave with master
bind = $mainMod SHIFT, N, layoutmsg, orientationcycle right left

# Example special workspace (scratchpad)
bind = $mainMod, minus, togglespecialworkspace, magic
bind = $mainMod SHIFT, minus, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

#Window tags for control windows (applets)
windowrule = tag +contr,class:^(org.pulseaudio.pavucontrol)$,title:^(Volume Control)$
windowrule = tag +contr,class:^(.blueman-manager-wrapped)$,title:^(Bluetooth Devices)$

windowrule =float, tag:contr
windowrule = move cursor 100%-w-50 10%, tag:contr

#Flameshot configurations to make it seemles
windowrulev2 = noanim, class:^(flameshot)$
windowrulev2 = float, class:^(flameshot)$
windowrulev2 = move 0 0, class:^(flameshot)$
windowrulev2 = pin, class:^(flameshot)$
windowrulev2 = stayfocused, class:^(flameshot)$
windowrulev2 = noborder, class:^(flameshot)$
windowrulev2 = norounding, class:^(flameshot)$
windowrulev2 = fullscreenstate 0 0, class:^(flameshot)$
bind = , code:107, exec, QT_QPA_PLATFORM=wayland flameshot gui

#calc (short for calculator)
windowrule = float, center, class:^(qalculate-gtk)$
windowrule = workspace special:calc, class:^(qalculate-gtk)$
bind = , code:148, togglespecialworkspace, calc
bind = $mainMod SHIFT, code:148, movetoworkspace, special:calc
bind = , code:148, exec, qalculate-gtk

# Rules for the Nix-Shell popup
windowrulev2 = float, class:^(nix-popup)$
windowrulev2 = size 1200 700, class:^(nix-popup)$
windowrulev2 = center, class:^(nix-popup)$
windowrulev2 = stayfocused, class:^(nix-popup)$
windowrule = workspace special:nix-popup, class:^(nix-popup)$
bind = $mainMod SHIFT, code:157, movetoworkspace, special:nix-popup
bind = , code:157, exec, ~/.config/hypr/scripts/toggle-nix-popup.sh

# Ignore maximize requests from apps.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
exec-once = waybar & firefox & swww-daemon & sleep 1 && swww init && flameshot && ~/.config/hypr/scripts/on-monitor-change.sh
exec-once = nm-applet

bind=,monitoradded,exec,~/.config/hypr/scripts/on-monitor-change.sh

bind = ALT SUPER SHIFT, L, exec, firefox -new-window "https://www.linkedin.com"
bind = ALT SUPER SHIFT, P, exec, firefox -new-window "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPUmafVB2u3w6rt9u4qYe-SjyFxAsqwquDjg&s"

bind = $mainMod, E, exec, ~/code/emoji/emojipick.py
